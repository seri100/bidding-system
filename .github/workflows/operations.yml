name: Operations recovery checks
on:
  push:
    paths: ['operations/**', '.github/workflows/operations.yml']
  pull_request:
    paths: ['operations/**', '.github/workflows/operations.yml']
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q operations/raspberrypi/source operations/tools operations/windows/source/bid_monitor
      - run: python -m unittest discover -s operations/tools -p test_verify_restore.py
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operations/windows/source/bid-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
