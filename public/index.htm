<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>입찰 적격성 평가 시스템</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f5f5; }
    .header { background: #2c3e50; color: white; padding: 20px; text-align: center; position: relative; }
    .header h1 { margin-bottom: 5px; font-size: 28px; }
    .header p { font-size: 12px; color: #ecf0f1; }
    .top-right { position: absolute; top: 15px; right: 20px; font-size: 12px; }
    .top-right button { margin-left: 10px; padding: 6px 12px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .top-right button:hover { background: #2980b9; }
    .container { max-width: 1200px; margin: 0 auto; }
    .tabs { display: flex; gap: 5px; padding: 15px; background: #ecf0f1; flex-wrap: wrap; }
    .tab-btn { padding: 10px 16px; background: #bdc3c7; border: none; cursor: pointer; border-radius: 4px; font-size: 14px; font-weight: 500; }
    .tab-btn.active { background: #3498db; color: white; }
    .tab-btn:hover { background: #95a5a6; }
    .tab-content { display: none; padding: 20px; background: white; margin: 10px; border-radius: 4px; }
    .tab-content.active { display: block; }
    .tab-content h2 { margin-bottom: 15px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; color: #2c3e50; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 14px; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #3498db; box-shadow: 0 0 5px rgba(52,152,219,0.3); }
    .btn { padding: 10px 18px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn:hover { background: #2980b9; }
    .btn-success { background: #27ae60; }
    .btn-success:hover { background: #229954; }
    .list { margin-top: 15px; }
    .list-item { padding: 12px; background: #ecf0f1; margin-bottom: 8px; border-radius: 4px; border-left: 4px solid #3498db; }
    .list-item strong { color: #2c3e50; display: block; margin-bottom: 4px; }
    .list-item small { color: #7f8c8d; }
    .status { padding: 12px; border-radius: 4px; margin-bottom: 15px; }
    .status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .status.pending { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table th, table td { padding: 10px; text-align: left; border-bottom: 1px solid #bdc3c7; }
    table th { background: #ecf0f1; font-weight: 600; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 15px 0; }
    .stat-box { padding: 15px; background: #f9f9f9; border-radius: 4px; border-left: 4px solid #3498db; }
    .stat-box h4 { color: #2c3e50; margin-bottom: 5px; }
    .stat-box .number { font-size: 24px; font-weight: bold; color: #3498db; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 입찰 적격성 평가 시스템</h1>
    <p>공공 정보 기반 자동 입찰가 신청 및 평가</p>
    <div class="top-right">
      <span id="userEmail"></span>
      <button id="loginBtn" onclick="loginGoogle()" style="display:none;">Google 로그인</button>
      <button id="logoutBtn" onclick="logout()" style="display:none;">로그아웃</button>
    </div>
  </div>

  <div class="container">
    <!-- 탭 버튼 -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('agencies')">⚙️ 기관 관리</button>
      <button class="tab-btn" onclick="switchTab('companies')">🏢 업체 관리</button>
      <button class="tab-btn" onclick="switchTab('announcements')">📋 공고 관리</button>
      <button class="tab-btn" onclick="switchTab('analysis')">📊 입찰 분석</button>
    </div>

    <!-- ========== 기관 관리 탭 ========== -->
    <div id="agencies" class="tab-content active">
      <h2>⚙️ 기관 관리</h2>
      <div id="agencyList" class="list"></div>
      <div id="agencyDetail" style="margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 4px; display: none;">
        <h3 id="agencyName"></h3>
        <p><strong>평가 방식:</strong> <span id="agencyMethod"></span></p>
        <div id="scoringCriteria"></div>
        <div style="margin-top: 20px;">
          <h4>A값(사회보험료) 계산</h4>
          <div class="form-group">
            <label>기초금액 (원):</label>
            <input type="number" id="basicAmount" placeholder="예: 1000000000">
          </div>
          <button class="btn btn-success" onclick="calculateAValue()">📊 계산하기</button>
          <div id="aValueResult" style="margin-top: 15px; padding: 10px; background: white; border-radius: 4px; display: none;">
            <h5>계산 결과</h5>
            <div id="aValueTable"></div>
            <p style="margin-top: 10px;"><strong>순공사원가:</strong> <span id="netConstructionCost"></span></p>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== 업체 관리 탭 ========== -->
    <div id="companies" class="tab-content">
      <h2>🏢 업체 관리</h2>
      <button class="btn btn-success" onclick="openCompanyForm()" style="margin-bottom: 15px;">➕ 새 업체 등록</button>
      <div id="companyForm" style="display: none; padding: 15px; background: #f9f9f9; border-radius: 4px; margin-bottom: 20px;">
        <h4>업체 정보 입력</h4>
        <div class="form-group">
          <label>업체명:</label>
          <input type="text" id="companyName" placeholder="업체명">
        </div>
        <div class="form-group">
          <label>사업자번호:</label>
          <input type="text" id="companyRegNo" placeholder="123-45-67890">
        </div>
        <div class="form-group">
          <label>대표자명:</label>
          <input type="text" id="companyRep" placeholder="대표자명">
        </div>
        <button class="btn btn-success" onclick="saveCompany()">💾 저장</button>
        <button class="btn" onclick="closeCompanyForm()" style="background: #95a5a6;">✕ 취소</button>
      </div>
      <div id="companyList" class="list"></div>
    </div>

    <!-- ========== 공고 관리 탭 ========== -->
    <div id="announcements" class="tab-content">
      <h2>📋 공고 관리</h2>
      <button class="btn btn-success" onclick="collectAnnouncements()" style="margin-bottom: 15px;">📥 공고 수집</button>
      <div id="collectionStatus"></div>
      <div id="announcementList" class="list"></div>
    </div>

    <!-- ========== 입찰 분석 탭 ========== -->
    <div id="analysis" class="tab-content">
      <h2>📊 입찰 분석</h2>
      <div class="form-group">
        <label>공고 선택:</label>
        <select id="announcementSelect">
          <option value="">-- 공고를 선택하세요 --</option>
        </select>
      </div>
      <div class="form-group">
        <label>업체 선택:</label>
        <select id="companySelect">
          <option value="">-- 업체를 선택하세요 --</option>
        </select>
      </div>
      <button class="btn btn-success" onclick="analyzeBid()">🔍 분석 실행</button>
      <div id="analysisResult" style="margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 4px; display: none;">
        <h3>분석 결과</h3>
        <div id="analysisContent"></div>
      </div>
    </div>
  </div>

  <script>
    let currentAgencyCode = null;

    // 탭 전환
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'agencies') loadAgencies();
      if (tabName === 'companies') loadCompanies();
      if (tabName === 'announcements') loadAnnouncements();
    }

    // ========== 기관 관리 ==========
    function loadAgencies() {
      fetch('/api/agencies')
        .then(r => r.json())
        .then(data => {
          const html = data.agencies.map(a => 
            `<div class="list-item" onclick="selectAgency('${a.code}', '${a.name}')" style="cursor:pointer;">
              <strong>${a.name}</strong> (${a.code})<br>
              <small>평가 방식: ${a.evaluationMethod}</small>
            </div>`
          ).join('');
          document.getElementById('agencyList').innerHTML = html;
        })
        .catch(e => console.error('❌ 기관 로드 오류:', e));
    }

    function selectAgency(code, name) {
      currentAgencyCode = code;
      fetch(`/api/agencies/${code}`)
        .then(r => r.json())
        .then(data => {
          const a = data.agency;
          document.getElementById('agencyName').textContent = a.name;
          document.getElementById('agencyMethod').textContent = a.evaluationMethod;
          
          let criteria = '<table><tr><th>항목</th><th>비율</th></tr>';
          Object.entries(a.scoringCriteria).forEach(([key, val]) => {
            criteria += `<tr><td>${key}</td><td>${val}%</td></tr>`;
          });
          criteria += '</table>';
          document.getElementById('scoringCriteria').innerHTML = criteria;
          document.getElementById('agencyDetail').style.display = 'block';
        })
        .catch(e => console.error('❌ 오류:', e));
    }

    function calculateAValue() {
      const basicAmount = parseInt(document.getElementById('basicAmount').value);
      if (!basicAmount) { alert('기초금액을 입력하세요'); return; }
      
      fetch(`/api/agencies/${currentAgencyCode}/calculate-avalue`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ basicAmount })
      })
        .then(r => r.json())
        .then(data => {
          const av = data.aValue;
          let table = '<table><tr><th>항목</th><th>금액</th></tr>';
          Object.entries(av).forEach(([key, val]) => {
            if (key !== 'total' && !key.startsWith('_')) {
              table += `<tr><td>${key}</td><td>${val.toLocaleString()}원</td></tr>`;
            }
          });
          table += `<tr style="background:#e8f4f8;"><td><strong>합계</strong></td><td><strong>${av.total.toLocaleString()}원</strong></td></tr></table>`;
          document.getElementById('aValueTable').innerHTML = table;
          document.getElementById('netConstructionCost').textContent = (basicAmount - av.total).toLocaleString() + '원';
          document.getElementById('aValueResult').style.display = 'block';
        })
        .catch(e => console.error('❌ 오류:', e));
    }

    // ========== 업체 관리 ==========
    function openCompanyForm() {
      document.getElementById('companyForm').style.display = 'block';
    }

    function closeCompanyForm() {
      document.getElementById('companyForm').style.display = 'none';
      document.getElementById('companyName').value = '';
      document.getElementById('companyRegNo').value = '';
      document.getElementById('companyRep').value = '';
    }

    function saveCompany() {
      const company = {
        name: document.getElementById('companyName').value,
        registrationNumber: document.getElementById('companyRegNo').value,
        representative: document.getElementById('companyRep').value
      };

      if (!company.name || !company.registrationNumber) {
        alert('필수 정보를 입력하세요');
        return;
      }

      fetch('/api/companies', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(company)
      })
        .then(r => r.json())
        .then(data => {
          alert('✅ 업체가 저장되었습니다');
          closeCompanyForm();
          loadCompanies();
        })
        .catch(e => alert('❌ 저장 실패: ' + e.message));
    }

    function loadCompanies() {
      fetch('/api/companies')
        .then(r => r.json())
        .then(data => {
          const html = data.companies?.map(c => 
            `<div class="list-item">
              <strong>${c.name}</strong><br>
              <small>사업자: ${c.registrationNumber} | 대표: ${c.representative}</small>
            </div>`
          ).join('') || '<p>등록된 업체가 없습니다.</p>';
          document.getElementById('companyList').innerHTML = html;
        })
        .catch(e => console.error('❌ 오류:', e));
    }

    // ========== 공고 관리 ==========
    function collectAnnouncements() {
      document.getElementById('collectionStatus').innerHTML = '<div class="status pending">⏳ 공고 수집 중...</div>';
      
      fetch('/api/announcements/collect', {method: 'POST'})
        .then(r => r.json())
        .then(d => {
          if (d.success) {
            let html = `<div class="status success">
              <h4>✅ 수집 완료</h4>
              <p><strong>총 공고문:</strong> ${d.total}개</p>
              <p><strong>저장:</strong> ${d.message}</p>
              <h5 style="margin-top:10px;">기관별 현황:</h5>
              <ul>`;
            Object.entries(d.stats.byAgency).forEach(([code, info]) => {
              if (info.count > 0) {
                html += `<li><strong>${code}</strong>: ${info.count}개</li>`;
              }
            });
            html += `</ul></div>`;
            document.getElementById('collectionStatus').innerHTML = html;
            loadAnnouncements();
          }
        })
        .catch(e => {
          document.getElementById('collectionStatus').innerHTML = `<div class="status error">❌ 오류: ${e.message}</div>`;
        });
    }

    function loadAnnouncements() {
      fetch('/api/announcements')
        .then(r => r.json())
        .then(d => {
          const html = d.announcements?.map(a => 
            `<div class="list-item">
              <strong>${a.title}</strong><br>
              <small>기관: ${a.agencyName} | 기초금액: ${a.basicAmount?.toLocaleString()}원 | 마감: ${a.deadline || '미지정'}</small>
            </div>`
          ).join('') || '<p>공고가 없습니다.</p>';
          document.getElementById('announcementList').innerHTML = html;
        })
        .catch(e => console.error('❌ 오류:', e));
    }

    // ========== 입찰 분석 ==========
    function analyzeBid() {
      alert('입찰 분석 기능은 준비 중입니다.');
    }

    // ========== 인증 ==========
    function loginGoogle() {
      window.location.href = '/auth/google';
    }

    function logout() {
      window.location.href = '/auth/logout';
    }

    // 초기 로드
    window.onload = () => {
      fetch('/auth/user')
        .then(r => r.json())
        .then(data => {
          if (data.user) {
            document.getElementById('userEmail').textContent = '👤 ' + data.user.email;
            document.getElementById('logoutBtn').style.display = 'inline-block';
          } else {
            document.getElementById('loginBtn').style.display = 'inline-block';
          }
        });
      loadAgencies();
    };
  </script>
</body>
</html>
